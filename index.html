<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#543f6e">
  <title>Unity Fieldwork - Daily operations</title>
  <link rel="stylesheet" href="style.css?v=13">
  <link rel="stylesheet" href="mobile.css?v=13">
  <link rel="stylesheet" href="job-ui.css?v=13">
  <link rel="manifest" href="manifest.webmanifest?v=13">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Unity Fieldwork">
</head>
<body>
  <aside>
    <a class="brand" href="#"><img src="unity-logo.webp?v=13" alt="Unity Property Management"><span class="app-label">FIELDWORK</span></a>
    <small>PROPERTY SERVICES</small><nav id="nav"></nav>
    <div class="aside-bottom"><span class="avatar">U</span><div>Two-person crew<small>Complete field demo</small></div></div>
  </aside>
  <main>
    <header><div><span class="eyebrow">YOUR OPERATIONS, CONNECTED</span><h1 id="title">Dispatch board</h1></div><div class="header-actions"><span id="date"></span><button id="new-job">+ Work order</button></div></header>
    <div class="notice">Complete field demo - changes save on this device. Sample durations and locations are illustrative.</div>
    <section id="app">
      <p class="notice" id="startup-status" role="status">Starting interactive field tools...</p>
      <noscript><p style="padding:16px;background:#fff3cd">JavaScript is disabled in this browser. Open this page in Safari or Chrome to use the interactive tools.</p></noscript>
    </section>
  </main>
  <dialog id="modal"><form id="modal-form"></form></dialog><div id="toast" role="status"></div>
  <script>
  (function () {
    var ready = false, failed = false;
    function fail(message) {
      if (ready) return;
      failed = true;
      var panel = document.getElementById('startup-error');
      if (!panel) {
        panel = document.createElement('section');
        panel.id = 'startup-error';
        panel.className = 'panel';
        panel.setAttribute('role', 'alert');
        var title = document.createElement('h2');
        title.textContent = 'Field tools could not start';
        var detail = document.createElement('pre');
        detail.style.cssText = 'white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px';
        var reload = document.createElement('button');
        reload.textContent = 'Reload field tools';
        reload.onclick = function () {
          var url = new URL(location.href);
          url.searchParams.set('reload', String(Date.now()));
          location.replace(url.href);
        };
        panel.append(title, detail, reload);
        document.querySelector('main').prepend(panel);
      }
      panel.querySelector('pre').textContent += 'Build 13: ' + message + '\n';
      var status = document.getElementById('startup-status');
      if (status) status.textContent = 'Startup failed. See the error above.';
    }
    window.UnityBoot = {
      fail: fail,
      complete: function () {
        if (failed) return;
        if (typeof render !== 'function' || !document.querySelector('#nav [data-page]')) {
          fail('The application did not initialize.');
          return;
        }
        ready = true;
        document.documentElement.dataset.unityReady = '13';
      }
    };
    window.addEventListener('error', function (event) {
      if (event.target && event.target.tagName === 'SCRIPT') {
        fail('Script could not load: ' + event.target.src);
      } else if (event.message) {
        fail(event.message + ' (' + (event.filename || 'startup') + ':' + (event.lineno || 0) + ')');
      }
    }, true);
    window.addEventListener('unhandledrejection', function (event) {
      fail(String(event.reason && event.reason.message || event.reason || 'Startup request failed.'));
    });
    setTimeout(function () { if (!ready && !failed) fail('Startup timed out. Check the internet connection and reload.'); }, 12000);
  }());
  </script>
  <script src="logic.js?v=13"></script>
  <script src="app.js?v=13"></script>
  <script src="mobile.js?v=13"></script>
  <script src="field.js?v=13"></script>
  <script src="job-ui.js?v=13"></script>
  <script>window.UnityBoot.complete();</script>
</body>
</html>
