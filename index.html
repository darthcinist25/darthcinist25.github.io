  <script>(function(root){
function estimate(v){const hours=Number(v.hours),rate=Number(v.rate),materials=Number(v.materials),markup=Number(v.markup);if([hours,rate,materials,markup].some(x=>!Number.isFinite(x)||x<0))throw Error('Use valid, non-negative amounts.');const labor=hours*rate,materialPrice=materials*(1+markup/100),total= Math.round((labor+materialPrice)*100)/100;const cost=v.cost===''||v.cost==null?null:Number(v.cost);if(cost!==null&&(!Number.isFinite(cost)||cost<0))throw Error('Enter a valid labor cost.');const directCost=cost===null?null:hours*cost+materials;return {labor,materialPrice,total,directCost,contribution:directCost===null?null:total-directCost};}
function capacity(jobs,tech,travel,other){const assigned=jobs.filter(j=>j.tech===tech);const work=assigned.reduce((a,j)=>{const actual=Number(j.actual||0)+(j.timer?Math.max(0,(Date.now()-j.timer)/3600000):0);return a+(j.status==='Complete'&&actual>0?actual:Math.max(Number(j.hours),actual));},0);const stops=new Set(assigned.map(j=>j.property)).size;return {work,travel:stops*travel/60,total:work+stops*travel/60+other/60,stops};}
root.FW={estimate,capacity};if(typeof module!=='undefined')module.exports=root.FW;
})(typeof window==='undefined'?globalThis:window);
</script>
  <script>const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n);
const today=new Date().toLocaleDateString('en-CA');
const DEMO_STORAGE_KEY='unity-fieldwork-complete-demo-v9';

]};
let state;try{state=JSON.parse(localStorage.getItem(DEMO_STORAGE_KEY))}catch{state=null}
if(!state||state.demoVersion!==9||!Array.isArray(state.jobs)||state.jobs.length<8||!state.settings){state=JSON.parse(JSON.stringify(seed));try{localStorage.setItem(DEMO_STORAGE_KEY,JSON.stringify(state))}catch{}}
let page='dispatch',tech='Tech 1',search='',filter='All',selectedDate=today;
function save(){try{localStorage.setItem(DEMO_STORAGE_KEY,JSON.stringify(state))}catch{toast('Browser storage is full. Export your data before continuing.');throw Error('Storage unavailable')}}
function log(msg){state.activity.unshift({text:msg,at:new Date().toISOString()});state.activity=state.activity.slice(0,100);save()}
function toast(s){$('#toast').textContent=s;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',3500)}
function dayJobs(){return state.jobs.filter(j=>j.date===selectedDate)}
function caps(t){return FW.capacity(dayJobs(),t,state.settings.travel,state.settings.other)}
function badge(j){return `<span class="badge ${j.priority==='High'?'high':j.status==='On hold'?'hold':''}">${esc(j.priority==='High'?'HIGH PRIORITY':j.status)}</span>`}
function card(j){return `<article class="job" tabindex="0" role="button" data-job="${esc(j.id)}" aria-label="Open ${esc(j.title)}"><div class="job-top">${badge(j)}<span class="muted">${j.hours}h planned</span></div><h3>${esc(j.property)}</h3><p>${esc(j.title)}</p><p>${esc(j.zone)}${j.recurring?' � ? '+esc(j.recurring):''}</p><div class="job-footer"><span>#${esc(j.id)}</span><span>${esc(j.status)} </span></div></article>`}
function metrics(){const assigned=dayJobs().filter(j=>j.tech!=='Unassigned'),hours=assigned.filter(j=>j.status!=='On hold').reduce((a,j)=>a+Number(j.hours),0);return `<div class="metrics"><div class="metric featured"><label>Scheduled job hours</label><strong>${hours.toFixed(1)} <span style="font-size:15px">/ 12-13h</span></strong><small>Combined daily crew target</small></div><div class="metric"><label>Work orders today</label><strong>${assigned.length}</strong><small>${assigned.filter(j=>j.status==='Complete').length} complete � two technicians</small></div><div class="metric"><label>Planned labor revenue</label><strong>${money(hours*state.settings.rate)}</strong><small>Before minimums, materials and tax</small></div><div class="metric"><label>Estimates awaiting review</label><strong>${state.estimates.filter(e=>e.status==='Draft').length}</strong><small>Additional work, captured in the field</small></div></div>`}
function lane(t){const c=caps(t);return `<div class="lane"><div class="lane-head"><h3>${t}</h3><span class="badge">${c.stops} stops</span></div><div class="bar"><i style="width:${Math.min(c.total/8*100,100)}%"></i></div><div class="muted">${c.work.toFixed(1)}h work � ${c.travel.toFixed(1)}h travel � ${(state.settings.other/60).toFixed(1)}h other</div><p class="${c.total>8?'warning':'muted'}">${c.total>8?'? Over shift by '+(c.total-8).toFixed(1)+'h':(8-c.total).toFixed(1)+'h shift buffer'}${c.work>6.5?' � Above job-hour target':''}</p>${dayJobs().filter(j=>j.tech===t).map(card).join('')||'<div class="empty">No work assigned for this date.</div>'}</div>`}
function render(){const nav=[['dispatch','?','Dispatch board'],['today','?','My day'],['orders','?','Work orders'],['estimates','+','Job estimates'],['settings','?','Settings']];$('#nav').innerHTML=nav.map(([id,icon,name])=>`<button data-page="${id}" class="${page===id?'active':''}">${icon} &nbsp; ${name}</button>`).join('');$('#title').textContent=nav.find(n=>n[0]===page)[2];$('#date').textContent=new Date().toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});const app=$('#app');
if(page==='dispatch')app.innerHTML=metrics()+`<div class="section-head"><div><h2>A clear plan. Room for real life.</h2><p class="muted">Keep the crew moving, with every work order in reach.</p></div><input style="width:155px" aria-label="Schedule date" type="date" id="schedule-date" value="${selectedDate}"></div><div class="grid"><div class="crew">${lane('Tech 1')}${lane('Tech 2')}</div><div class="rail"><div class="panel insight"><span class="eyebrow">SCHEDULING ASSIST</span><h3 style="margin-top:14px">Make the next stop count.</h3><p>Group work at the same property. Protect recurring visits. Check urgent jobs before adding another stop.</p><button id="suggest">Find a next job </button><p class="muted">Rule-based suggestions � no live traffic or AI connection</p></div><div class="panel"><h3>Ready & waiting</h3>${state.jobs.filter(j=>j.tech==='Unassigned').map(card).join('')}</div></div></div>`;
if(page==='today'){const jobs=dayJobs().filter(j=>j.tech===tech),done=jobs.filter(j=>j.status==='Complete').length;app.innerHTML=`<div class="section-head"><div><h2>Good work starts here.</h2><p class="muted">${done} of ${jobs.length} jobs complete. Open a job to update the field record.</p></div><select id="tech" class="tech-select">${['Tech 1','Tech 2'].map(t=>`<option ${t===tech?'selected':''}>${t}</option>`).join('')}</select></div><div class="grid"><div>${jobs.map(card).join('')||'<div class="empty">No jobs on this date.</div>'}</div><div class="panel" style="align-self:start"><h3>Finished ahead of schedule?</h3><p class="muted">Find an unassigned job that fits the remaining planned shift. Held work is excluded.</p><button id="suggest">Find a next job </button><div class="line"><span>Job-hour target</span><b>6-6�h</b></div><div class="line"><span>Shift length</span><b>8h</b></div><p class="muted">This view uses the date selected on Dispatch. Technician names are demo roles, not authenticated accounts.</p></div></div>`}

};
function orderJobs(){modal(`<h2>Reorder your stops</h2><p class="muted">${esc(tech)} � ${selectedDate}. Manual order only; travel is not optimized.</p><div id="stop-order"></div><button type="button" data-close>Done</button>`);function draw(){const js=dayJobs().filter(j=>j.tech===tech);$('#stop-order').innerHTML=js.map((j,i)=>`<div class="line"><div><b>${i+1}. ${esc(j.property)}</b><p class="muted">${esc(j.title)}</p></div><button type="button" data-up="${esc(j.id)}" ${i===0?'disabled':''} aria-label="Move ${esc(j.title)} earlier"> Earlier</button></div>`).join('');document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{const idx=state.jobs.findIndex(j=>j.id===b.dataset.up),prev=state.jobs.findIndex(j=>j.id===js[js.findIndex(x=>x.id===b.dataset.up)-1].id);[state.jobs[idx],state.jobs[prev]]=[state.jobs[prev],state.jobs[idx]];log('Reordered stops for '+tech);render();draw()})}draw()}
function readyWork(){const js=state.jobs.filter(j=>j.tech==='Unassigned'&&j.status==='Ready');modal(`<h2>Available work</h2><p class="muted">Select ready work manually. Check access, priority and travel before assigning.</p>${js.map(j=>`<div class="list-item"><b>${esc(j.property)}</b><p>${esc(j.title)} � ${j.hours}h</p><button type="button" data-ready="${esc(j.id)}">Add to my day</button></div>`).join('')||'<p>No ready unassigned jobs.</p>'}<div class="actions"><button type="button" data-close>Close</button></div>`);document.querySelectorAll('[data-ready]').forEach(b=>b.onclick=()=>{const j=state.jobs.find(j=>j.id===b.dataset.ready),c=caps(tech);const extra=Number(j.hours)+(dayJobs().some(x=>x.tech===tech&&x.property===j.property)?0:state.settings.travel/60);if(c.total+extra>8||c.work+Number(j.hours)>6.5){toast('This exceeds planned capacity. Adjust your day first.');return}Object.assign(j,{tech,date:selectedDate,status:'Scheduled'});log('Added ready work '+j.id);$('#modal').close();render()})}
function reportText(js){return `UNITY FIELD REPORT\n${tech} | ${selectedDate}\nDevice demo - manually shared, not submitted to the office.\nHours below are recorded totals for orders scheduled on this date, not a payroll timesheet.\n\n`+js.map(j=>`${j.property} | #${j.id}\n${j.title}\nStatus: ${j.status}\nRecorded labor: ${Number(j.actual||0).toFixed(2)}h${j.timer?' (timer still running; stop it before final report)':''}\nMaterials cost: ${money(j.materials||0)}\nNotes: ${j.notes||'None'}\nOutstanding: ${j.blocker||'None recorded'}`).join('\n\n')+`\n\nDraft additions:\n`+state.estimates.filter(e=>js.some(j=>j.id===e.job)).map(e=>`${e.property}: ${e.scope} - ${money(e.total)} (${e.status})`).join('\n')}
async function dailyReport(){const js=dayJobs().filter(j=>j.tech===tech),txt=reportText(js);modal(`<h2>End-of-day report</h2><p class="muted">${esc(tech)} � ${selectedDate}. Review before sharing. Nothing is sent automatically.</p><textarea readonly aria-label="Report preview" style="min-height:300px">${esc(txt)}</textarea><label class="check"><input id="report-photos" type="checkbox" checked> Include before-and-after photos in HTML report</label><div class="actions"><button type="button" id="report-download">Download report</button><button type="button" id="report-share">Share report</button><button type="button" data-close>Close</button></div>`);async function build(){let photos=[];if($('#report-photos').checked)photos=(await photosFor()).filter(p=>js.some(j=>j.id===p.job));return '<!doctype html><meta charset="utf-8"><title>Unity field report</title><style>body{font:16px system-ui;max-width:850px;margin:35px auto;padding:20px;color:#302d36}pre{white-space:pre-wrap;line-height:1.6}img{max-width:100%;max-height:500px}h1{color:#543f6e}figure{break-inside:avoid}</style><h1>Unity field report</h1><pre>'+esc(txt)+'</pre>'+photos.map(p=>'<figure><h3>'+esc(js.find(j=>j.id===p.job).property)+' � '+esc(p.kind)+'</h3><img src="'+p.data+'" alt="'+esc(p.kind)+'"><figcaption>'+esc(new Date(p.at).toLocaleString())+'</figcaption></figure>').join('')}
for(const [id,share]of [['report-download',false],['report-share',true]])$('#'+id).onclick=async()=>{try{const content=await build(),name=`Unity-${tech.replace(' ','-')}-${selectedDate}.html`;if(share)await shareFile(name,content,'text/html');else downloadFile(name,content)}catch{toast('Could not load photos. Uncheck photos to export the text report.')}}}
const previousReview=reviewEstimate;reviewEstimate=function(id){previousReview(id);const e=state.estimates.find(x=>x.id===id);$('#modal-form .actions').insertAdjacentHTML('afterbegin','<button type="button" id="share-addition">Share estimate</button>');$('#share-addition').onclick=()=>shareFile('Unity-addition-estimate.txt',`UNITY - ADDITIONAL WORK ESTIMATE\n${e.property} | Work order #${e.job}\n${e.scope}\nAdditional labor: ${e.hours} hours at ${money(e.rate)} = ${money(e.labor)}\nMaterials including markup: ${money(e.materialPrice)}\nTotal before tax: ${money(e.total)}\nStatus: ${e.status}\nAdditional work only. No new minimum charge. Obtain approval before proceeding.\n`,'text/plain')};
const previousRender=render;render=function(){previousRender();if(page==='today'){$('#app').insertAdjacentHTML('afterbegin','<div class="field-tools"><button id="reorder-stops">Reorder stops</button><button id="day-report">Day report</button></div>');$('#reorder-stops').onclick=orderJobs;$('#day-report').onclick=dailyReport;$('#app').insertAdjacentHTML('beforeend','<button class="field-primary" id="ready-work">Browse ready work</button>');$('#ready-work').onclick=readyWork;const old=state.jobs.filter(j=>j.tech===tech&&j.date<selectedDate&&j.status!=='Complete');if(old.length){$('#app').insertAdjacentHTML('beforeend','<h3 style="margin-top:25px">Unfinished from earlier visits</h3>'+old.map(card).join(''));document.querySelectorAll('[data-job]').forEach(b=>b.onclick=()=>openJob(b.dataset.job))}}};
window.addEventListener('online',()=>{if(!$('#modal').open)render()});window.addEventListener('offline',()=>{if(!$('#modal').open)render()});render();

const renderBeforeOpportunities=render;
render=function(){renderBeforeOpportunities();if(page!=='today')return;
const jobs=dayJobs().filter(j=>j.tech===tech),c=caps(tech),saved=jobs.filter(j=>j.status==='Complete'&&Number(j.actual)>0).reduce((n,j)=>n+Number(j.hours)-Number(j.actual),0);
const properties=new Set(jobs.map(j=>j.property));
const fits=state.jobs.filter(j=>j.tech==='Unassigned'&&j.status==='Ready'&&c.work+Number(j.hours)<=6.5&&c.total+Number(j.hours)+(properties.has(j.property)?0:state.settings.travel/60)<=8);
const room=Math.max(0,Math.min(6.5-c.work,8-c.total));
$('#app').insertAdjacentHTML('afterbegin','<section class="panel"><h3>'+ (saved>0?'Ahead by '+Math.round(saved*60)+' minutes':'Room for another job?')+'</h3><p>'+Math.round(room*60)+' minutes available before extra travel. '+fits.length+' ready '+(fits.length===1?'job fits':'jobs fit')+' the current allowances.</p><p class="muted">Completed work uses recorded hours. Unfinished and blocked work keeps its reserved time. Travel is an allowance, not live routing; check access and your remaining shift.</p><button id="review-opportunities" '+(!fits.length?'disabled':'')+'>Review suggested work</button></section>');
$('#review-opportunities').onclick=suggest;
};render();
</script>

function invoiceDocument(j,photos){const hours=Number(j.actual||0),labor=hours*Number(state.settings.rate),materials=Number(j.materials||0)*1.5,total=labor+materials;return `<!doctype html><meta charset="utf-8"><title>Invoice ${esc(j.id)}</title><style>body{font:16px system-ui;color:#302d36;max-width:850px;margin:35px auto;padding:24px}h1{color:#543f6e}header{display:flex;justify-content:space-between;gap:20px;border-bottom:3px solid #543f6e;padding-bottom:20px}table{width:100%;border-collapse:collapse;margin:28px 0}td,th{padding:13px;text-align:left;border-bottom:1px solid #ddd}td:last-child,th:last-child{text-align:right}.total{font-size:22px}.photos{display:grid;grid-template-columns:1fr 1fr;gap:18px}figure{margin:0;break-inside:avoid}img{width:100%;max-height:500px;object-fit:contain;background:#f4f1f6}small{color:#716b78}@media print{body{margin:0}.photos{display:block}figure{margin:20px 0}}</style><header><div><h1>Unity Property Management</h1><b>Work completed</b></div><div><b>Invoice / Work Order #${esc(j.id)}</b><br>${esc(j.date)}<br>${esc(j.tech)}</div></header><h2>${esc(j.property)}</h2><p>${esc(j.title)}</p><p>${esc(j.notes||'Work completed as described.')}</p><table><thead><tr><th>Description</th><th>Amount</th></tr></thead><tbody><tr><td>Labor - ${hours.toFixed(2)} hours at ${money(state.settings.rate)}/hour</td><td>${money(labor)}</td></tr><tr><td>Materials</td><td>${money(materials)}</td></tr><tr class="total"><td><b>Total before tax</b></td><td><b>${money(total)}</b></td></tr></tbody></table><p><b>Community manager:</b> ${esc(j.managerName)} &lt;${esc(j.managerEmail)}&gt;</p><h2>Job photos</h2><div class="photos">${photos.map(p=>`<figure><img src="${p.data}" alt="${esc(p.kind)} job photo"><figcaption>${esc(p.kind)} - ${esc(new Date(p.at).toLocaleString())}</figcaption></figure>`).join('')||'<p>No customer-facing job photos were recorded.</p>'}</div><p><small>Material purchase receipts are retained with the internal job record and are intentionally excluded from this invoice.</small></p>`}
async function invoiceJob(id){const j=state.jobs.find(x=>x.id===id);const photos=(await photosFor(id)).filter(p=>p.kind!=='Receipt');const html=invoiceDocument(j,photos);modal(`<h2>Invoice ready</h2><p><b>${esc(j.managerName)}</b><br>${esc(j.managerEmail)}</p><div class="panel"><div class="line"><span>Recorded labor</span><b>${Number(j.actual||0).toFixed(2)}h</b></div><div class="line"><span>Materials billed (50% markup)</span><b>${money(Number(j.materials||0)*1.5)}</b></div><div class="line"><span>Customer-facing photos</span><b>${photos.length}</b></div><div class="line"><span>Receipt photos included</span><b>No</b></div></div><p class="muted">Review the downloaded/shared invoice before sending. This device demo does not send email automatically.</p><div class="actions"><button type="button" class="primary" id="share-invoice">Share invoice</button><button type="button" id="download-invoice">Download</button><button type="button" data-close>Close</button></div>`);const name=`Unity-invoice-${j.id}.html`;$('#share-invoice').onclick=()=>shareFile(name,html,'text/html');$('#download-invoice').onclick=()=>downloadFile(name,html,'text/html')}

 openJobBeforeCards(id);
 const j=state.jobs.find(x=>x.id===id),form=$('#modal-form'),dialog=$('#modal');

 shell.querySelector('.close-job').onclick=()=>dialog.close();
 const brief=shell.querySelector('.work-brief');brief.append(title,description);

 const details=shell.querySelector('.details-panel');
 for(const name of ['tech','date','hours','actual'])details.append(fields[name].closest('label'));
 details.insertAdjacentHTML('beforeend',`<label class="field">Community manager<input required name="managerName" value="${esc(j.managerName||'')}" placeholder="Manager name"></label><label class="field">Manager email<input required type="email" name="managerEmail" value="${esc(j.managerEmail||'')}" placeholder="manager@example.com"></label>`);

 const choices=shell.querySelector('.status-choices');

 function paintStatus(){const status=fields.status.value;shell.querySelector('.job-state').textContent=status+(status!==j.status?' (unsaved)':'');choices.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.statusChoice===status)));shell.querySelector('.blocker-field').hidden=!['Need materials','Cannot access','Needs approval','On hold'].includes(status)}paintStatus();
